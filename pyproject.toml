[project]
name = "apidump"
version = "0.1.0"
description = "Generate API references for Python packages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
apidump = "apidump.cli:main"

[dependency-groups]
dev = [
    "networkx>=3.4.2",
    "pynapple>=0.11.0",
    "pytest>=8.0.0",
]
