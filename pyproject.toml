[project]
name = "apidump"
version = "0.1.0"
description = "Generate deterministic API reference files for Python packages, optimized for LLM agent consumption"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Jordan M. R. Fox", email = "jordanmrfox@gmail.com" },
]
keywords = ["api", "documentation", "llm", "agent", "reference", "inspection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jmrfox/apidump"
Repository = "https://github.com/jmrfox/apidump"
"Bug Tracker" = "https://github.com/jmrfox/apidump/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apidump"]

[project.scripts]
apidump = "apidump.cli:main"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "networkx>=3.4.2",
    "pynapple>=0.11.0",
    "pytest>=8.0.0",
]
